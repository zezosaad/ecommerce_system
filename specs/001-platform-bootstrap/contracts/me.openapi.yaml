openapi: 3.0.3
info:
  title: VendorHub Me API
  version: 0.1.0
  description: |
    Returns the authenticated user's application profile, active roles,
    and resolved permission set. Used by the dashboard and customer
    site after login to bootstrap UI gating.
servers:
  - url: https://api.example.com
  - url: http://localhost:3000
paths:
  /api/v1/me:
    get:
      summary: Get the current user's profile, roles, and permissions
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated; returns profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeSuccessEnvelope' }
        '401':
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: Profile missing or no roles assigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: Auth or DB dependency unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Translatable:
      type: object
      required: [ar, en]
      properties:
        ar: { type: string }
        en: { type: string }
    Meta:
      type: object
      required: [request_id, served_at, version]
      properties:
        request_id: { type: string }
        served_at: { type: string, format: date-time }
        version: { type: string }
    Role:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          enum:
            - super_admin
            - platform_admin
            - merchant_owner
            - merchant_staff
            - customer
            - support_agent
            - finance_admin
            - shipping_agent
        label: { $ref: '#/components/schemas/Translatable' }
        merchant_id:
          type: string
          format: uuid
          nullable: true
        store_id:
          type: string
          format: uuid
          nullable: true
    Profile:
      type: object
      required: [id, supabase_user_id, email, locale, is_active]
      properties:
        id: { type: string, format: uuid }
        supabase_user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        locale:
          type: string
          enum: [en, ar]
        phone: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    MeData:
      type: object
      required: [profile, roles, permissions]
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          description: "Resolved permission codes (from all role bindings)"
          items: { type: string }
    MeSuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/MeData' }
        meta: { $ref: '#/components/schemas/Meta' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error: { $ref: '#/components/schemas/Error' }
        meta: { $ref: '#/components/schemas/Meta' }
