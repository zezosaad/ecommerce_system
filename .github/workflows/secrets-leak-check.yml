name: Frontend Secret Leak Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vendorhub/dashboard build
      - run: pnpm --filter @vendorhub/website build
      - run: bash scripts/verify-no-frontend-secrets.sh
